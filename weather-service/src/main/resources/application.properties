spring.application.name=weather-iteration-2
chat.api-key=${OPENROUTER_API_KEY:}
chat.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=never
server.error.include-stacktrace=never
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}


# OAuth clients are optional; never commit their values.
auth.frontend-url=${AUTH_FRONTEND_URL:https://ariel-demo-next.onrender.com}
auth.backend-url=${AUTH_BACKEND_URL:https://ariel-demo-next-api.onrender.com}
auth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
auth.github.client-id=${GITHUB_CLIENT_ID:}
auth.github.client-secret=${GITHUB_CLIENT_SECRET:}
auth.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
auth.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=10m
simulation.database-url=${SIMULATION_DATABASE_URL:}
simulation.hosting-mode=${SIMULATION_HOSTING_MODE:free}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s



# Reuse existing PostgreSQL unless an authentication-specific connection is supplied.
auth.database-url=${AUTH_DATABASE_URL:${simulation.database-url}}
