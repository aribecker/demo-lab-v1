<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World · Java + JavaScript</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">JAVA + JAVASCRIPT</p>
      <h1>Hello World<span>!</span></h1>
      <p class="intro">Un pequeño saludo para empezar algo grande.</p>
      <section aria-label="Saludo del servidor">
        <p id="message" role="status" aria-live="polite">Pulsa el botón para recibir un saludo.</p>
        <button id="hello-button" type="button">Obtener saludo <span aria-hidden="true">↗</span></button>
      </section>
      <footer>Una aplicación simple, construida desde su especificación.</footer>
    </main>
  </body>
</html>
