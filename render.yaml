services:
  - type: web
    name: ariel-sdd-weather-microservice
    runtime: docker
    plan: free
    branch: java-fuentes
    dockerfilePath: ./Weather-Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: '8080'
  - type: web
    name: ariel-sdd-weather-java
    runtime: docker
    plan: free
    branch: java-fuentes
    dockerfilePath: ./Render-Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: '8080'
      - key: WEATHER_SERVICE_URL
        sync: false
