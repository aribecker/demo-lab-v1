# Independent Hello World environment; do not apply to the existing iteration-2 services.
# Actual creation and verification are recorded in docs/release.md.
services:
  - type: web
    name: ariel-demo-next-api
    runtime: docker
    repo: https://github.com/aribecker/0080-prueba-SDD-full-stack
    branch: proximo-desarrollo-hello-world
    plan: free
    region: oregon
    autoDeployTrigger: commit
    dockerfilePath: ./Weather-Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - weather-service/**
        - Weather-Dockerfile
        - .dockerignore
    envVars:
      - key: PORT
        value: "8080"
      - key: ALLOWED_ORIGINS
        value: https://ariel-demo-next.onrender.com,http://localhost:5173
      - key: AUTH_FRONTEND_URL
        value: https://ariel-demo-next.onrender.com
      - key: AUTH_BACKEND_URL
        value: https://ariel-demo-next-api.onrender.com

  - type: web
    name: ariel-demo-next
    runtime: static
    repo: https://github.com/aribecker/0080-prueba-SDD-full-stack
    branch: proximo-desarrollo-hello-world
    autoDeployTrigger: commit
    buildCommand: cd frontend && npm ci && npm test && npm run build
    staticPublishPath: frontend/dist
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_WEATHER_API_URL
        value: https://ariel-demo-next-api.onrender.com/api/weather
      - key: VITE_AUTH_API_URL
        value: https://ariel-demo-next-api.onrender.com
    # frontend/scripts/static-routes.mjs emits direct-entry HTML for each route.

