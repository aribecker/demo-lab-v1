spring.application.name=people-service
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=never
server.error.include-stacktrace=never
spring.profiles.active=${PEOPLE_PROFILE:preview}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
# Do not log SQL bind values, names or database credentials.
logging.level.com.zaxxer.hikari=OFF
logging.level.org.springframework.jdbc=OFF
logging.level.org.flywaydb=ERROR
