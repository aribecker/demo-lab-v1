spring.application.name=weather-microservice
server.port=${PORT:8081}
server.address=0.0.0.0
server.error.include-message=never
server.error.include-stacktrace=never
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
weather.primary-url=https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m&timezone=America%2FArgentina%2FBuenos_Aires
weather.fallback-url=https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=-34.6037&lon=-58.3816
weather.provider-timeout-ms=5000
server.shutdown=graceful
