# Optional separate deployment. This file has not been applied to live services.
services:
  - type: web
    name: ariel-sdd-weather-react
    runtime: docker
    plan: free
    branch: react-frontend-sdd
    dockerfilePath: ./Render-Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths: [frontend/**, java-backend/**, Render-Dockerfile, .dockerignore]
    envVars:
      - key: PORT
        value: '8080'
      - key: WEATHER_SERVICE_URL
        value: https://ariel-sdd-weather-microservice.onrender.com/api/weather
