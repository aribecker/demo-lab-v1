name: Inspect weather JAR manifest
on:
  push:
    branches: [inspect-weather-jar-manifest]
  workflow_dispatch:
jobs:
  build-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: weather-service/pom.xml
      - name: Build weather service
        run: mvn -B -f weather-service/pom.xml package
      - name: Display JAR manifest
        run: unzip -p weather-service/target/weather-service-0.0.8.jar META-INF/MANIFEST.MF
      - uses: actions/upload-artifact@v4
        with:
          name: weather-service-jar
          path: weather-service/target/weather-service-0.0.8.jar
